name: Check flight prices

on:
  schedule:
    - cron: "17 13 * * *"      # every day at 13:17 UTC (about 6-7 am in Alberta)
  workflow_dispatch:           # lets the "立即检查" button in the web app start it

permissions:
  contents: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/check_prices.py

      - name: Save results
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update prices $(date -u +%F)"
            git pull --rebase
            git push
          fi
